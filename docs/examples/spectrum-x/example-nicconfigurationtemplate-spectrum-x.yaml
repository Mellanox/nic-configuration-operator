# Supply a structured spcx-blueprint ConfigMap with data["blueprint.yaml"] in
# this namespace, and run Spectrum-X Operator to resolve the host bindings.
# Profile/platform and hardware/software PLB recipe must match that blueprint.
apiVersion: dms.nvidia.com/v1alpha1
kind: DMSPlanParams
metadata:
  name: spectrum-x
  namespace: nvidia-network-operator
spec:
  nodeSelector:
    feature.node.kubernetes.io/network-sriov.capable: "true"
  blueprintRef: spcx-blueprint
  profile: single-plane
  platformType: gb200
  planes: 1
  overlay: none
---
apiVersion: configuration.net.nvidia.com/v1alpha1
kind: NicConfigurationTemplate
metadata:
  name: spectrum-x-configuration
  namespace: nvidia-network-operator
spec:
  nodeSelector:
    feature.node.kubernetes.io/network-sriov.capable: "true"
  nicSelector:
    nicType: "a2dc"
  planRef:
    namespace: nvidia-network-operator
    name: spectrum-x
