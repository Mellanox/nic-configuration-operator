{{- range .Values.configDaemon.env }}
{{- if has .name (list "FIRMWARE_IMAGE_CACHE_DIR" "FIRMWARE_IMAGE_AUTH_DIR" "FIRMWARE_IMAGE_CA_FILE" "FIRMWARE_IMAGE_CACHE_SIZE") }}
{{- fail (printf "configDaemon.env name %s is managed by the chart" .name) }}
{{- end }}
{{- end }}
{{- $firmwareSecrets := .Values.firmwareImagePullSecrets | default list }}
{{- if gt (len $firmwareSecrets) 32 }}
{{- fail "firmwareImagePullSecrets must contain at most 32 names" }}
{{- end }}
{{- if ne (len $firmwareSecrets) (len (uniq $firmwareSecrets)) }}
{{- fail "firmwareImagePullSecrets must not contain duplicate names" }}
{{- end }}
{{- range $firmwareSecrets }}
{{- if or (gt (len .) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" .)) }}
{{- fail (printf "firmwareImagePullSecrets contains invalid Secret name %q" .) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nic-configuration-daemon
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nic-configuration-daemon
    app.kubernetes.io/created-by: nic-configuration-operator
    app.kubernetes.io/part-of: nic-configuration-operator
    {{- include "nic-configuration-operator.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      control-plane: nic-configuration-daemon
      {{- include "nic-configuration-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: nic-configuration-daemon
      labels:
        control-plane: nic-configuration-daemon
        nvidia.com/nic-configuration-daemon: ""
        {{- include "nic-configuration-operator.selectorLabels" . | nindent 8 }}
    spec:
      nodeSelector: {{- toYaml .Values.configDaemon.nodeSelector | nindent 8 }}
      serviceAccountName: {{ include "nic-configuration-operator.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      hostNetwork: true
      hostPID: true
      priorityClassName: system-node-critical
      containers:
        - image: "{{ .Values.configDaemon.image.repository }}/{{ .Values.configDaemon.image.name }}:{{ .Values.configDaemon.image.tag | default .Chart.AppVersion }}"
          name: nic-configuration-daemon
          securityContext:
            privileged: true
          resources: {{- toYaml .Values.configDaemon.resources | nindent 12 }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FIRMWARE_IMAGE_CACHE_DIR
              value: /nic-firmware-images
            - name: FIRMWARE_IMAGE_CACHE_SIZE
              value: {{ .Values.firmwareImageCacheSize | quote }}
            {{- if $firmwareSecrets }}
            - name: FIRMWARE_IMAGE_AUTH_DIR
              value: /var/run/nic-firmware-auth
            {{- end }}
            {{- if .Values.certConfig }}
            - name: FIRMWARE_IMAGE_CA_FILE
              value: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
            {{- end }}
            {{- if .Values.configDaemon.env }}
            {{- toYaml .Values.configDaemon.env | nindent 12 }}
            {{- end }}
            {{- if .Values.logLevel}}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel }}
            {{- end}}
          volumeMounts:
            - name: firmware-images
              mountPath: /nic-firmware-images
            {{- range $index, $secret := $firmwareSecrets }}
            - name: firmware-auth-{{ $index }}
              mountPath: {{ printf "/var/run/nic-firmware-auth/%s" $secret | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.certConfig }}
            - name: trusted-ca
              mountPath: /etc/pki/ca-trust/extracted/pem
              readOnly: true
            {{- end }}
            - name: sys
              mountPath: /sys
              readOnly: false
            - name: proc
              mountPath: /proc
              readOnly: false
            - name: host
              mountPath: /host
            - name: dev
              mountPath: /dev
              readOnly: false
            {{- if .Values.nicFirmwareStorage.pvcName }}
            - name: firmware-cache
              mountPath: /nic-firmware
              readOnly: true
            {{- end }}
      volumes:
        - name: firmware-images
          emptyDir:
            sizeLimit: {{ .Values.firmwareImageCacheSize | quote }}
        {{- range $index, $secret := $firmwareSecrets }}
        - name: firmware-auth-{{ $index }}
          secret:
            secretName: {{ $secret | quote }}
            optional: true
        {{- end }}
        {{- if .Values.certConfig }}
        - name: trusted-ca
          configMap:
            name: {{ .Values.certConfig.name | quote }}
            optional: true
            items:
              - key: ca-bundle.crt
                path: tls-ca-bundle.pem
        {{- end }}
        - name: sys
          hostPath:
            path: /sys
        - name: proc
          hostPath:
            path: /proc
        - name: host
          hostPath:
            path: /
        - name: dev
          hostPath:
            path: /dev
        {{- if .Values.nicFirmwareStorage.pvcName }}
        - name: firmware-cache
          persistentVolumeClaim:
            claimName: {{ .Values.nicFirmwareStorage.pvcName }}
        {{- end }}
